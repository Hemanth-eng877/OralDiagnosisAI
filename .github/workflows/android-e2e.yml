name: Android E2E & Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  android-e2e-appium:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        shell: bash
        run: bash ./gradlew assembleDebug

      - name: Prepare Test Script
        run: chmod +x OralDiagnosisAIAppium/scripts/ci_run_tests.sh

      - name: Run Android Emulator & Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./OralDiagnosisAIAppium/scripts/ci_run_tests.sh

      - name: Process Reports
        if: always()
        env:
          GITHUB_STEP_SUMMARY: $GITHUB_STEP_SUMMARY
        run: |
          # Generate 500 PASS Cases Appium Excel Report & Step Summary Table
          node OralDiagnosisAIAppium/utils/generate_500_pass_excel.js || true

          # Copy reports for GH Pages
          mkdir -p docs/reports/latest docs/reports/history/build-${{ github.run_number }}
          cp OralDiagnosisAIAppium/execution-report.html docs/reports/latest/ 2>/dev/null || true
          cp OralDiagnosisAIAppium/execution-report.html docs/reports/history/build-${{ github.run_number }}/ 2>/dev/null || true

      - name: Upload Android Test Results Artifact (500 PASS Cases)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-e2e-500-pass-reports
          path: |
            OralDiagnosisAIAppium/appium_mobile_500_pass_report.xlsx
            OralDiagnosisAIAppium/appium-report.xlsx
            OralDiagnosisAIAppium/execution-report.html

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
