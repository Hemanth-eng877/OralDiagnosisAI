name: Deploy and E2E Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  e2e-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            OralDiagnosisAIE2E/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Frontend
        working-directory: web
        run: |
          npm run build
          mkdir -p dist/reports/latest
          mkdir -p dist/reports/history/build-${{ github.run_number }}

      - name: Start Vite Preview Server
        working-directory: web
        run: |
          npx vite preview --host 127.0.0.1 --port 5173 &
          sleep 10
          curl -f http://127.0.0.1:5173
          echo "TEST_BASE_URL=http://127.0.0.1:5173" >> $GITHUB_ENV

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install E2E Dependencies
        working-directory: ./OralDiagnosisAIE2E
        run: |
          rm -rf node_modules
          rm -f package-lock.json

          npm install

          echo "Installed binaries:"
          ls -la node_modules/.bin

          chmod +x node_modules/.bin/mocha || true

          npx mocha --version

      - name: Run Selenium E2E Test Suite (1,100 Assertions)
        working-directory: ./OralDiagnosisAIE2E
        env:
          TEST_BASE_URL: ${{ env.TEST_BASE_URL }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npx mocha tests/mega_web_1100.test.js --timeout 120000

      - name: Verify Generated Reports
        if: always()
        working-directory: ./OralDiagnosisAIE2E
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Installed binaries:"
          ls -la node_modules/.bin
          if [ -f execution-report.html ]; then
            echo "SUCCESS: execution-report.html found"
          else
            echo "ERROR: execution-report.html NOT found"
          fi

      - name: Process Reports
        if: always()
        env:
          GITHUB_STEP_SUMMARY: $GITHUB_STEP_SUMMARY
        run: |
          node OralDiagnosisAIE2E/utils/generate_500_pass_excel.js || true
          mkdir -p web/dist/reports/latest
          mkdir -p web/dist/reports/history/build-${{ github.run_number }}

          if [ -f OralDiagnosisAIE2E/execution-report.html ]; then
            cp OralDiagnosisAIE2E/execution-report.html web/dist/reports/latest/
            cp OralDiagnosisAIE2E/execution-report.html web/dist/reports/history/build-${{ github.run_number }}/
          else
            echo "<html><body><h1>No execution report generated.</h1></body></html>" > web/dist/reports/latest/execution-report.html
            cp web/dist/reports/latest/execution-report.html web/dist/reports/history/build-${{ github.run_number }}/
          fi

      - name: Upload Selenium Web E2E Excel Reports (500 PASS Cases)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-e2e-500-pass-reports
          path: |
            OralDiagnosisAIE2E/selenium_e2e_500_pass_report.xlsx
            OralDiagnosisAIE2E/selenium-report.xlsx
            OralDiagnosisAIE2E/execution-report.html

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4