name: Backend API Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Configure Firebase Key
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          if [ -n "$FIREBASE_KEY" ]; then
            echo "$FIREBASE_KEY" > firebase-key.json
          else
            echo "{}" > firebase-key.json
          fi

      - name: Run API Tests
        id: api_tests
        run: |
          mkdir -p reports
          pytest tests/ --junitxml=reports/api-tests.xml -v

      - name: Upload API Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: reports/api-tests.xml
